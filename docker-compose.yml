services:

  mysql:
    image: mysql:8.0
    container_name: two-tier-mysql

    environment:
      MYSQL_DATABASE: devops
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - two-tier-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  flask:
    build:
      context: .

    container_name: two-tier-flask

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: devops

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - two-tier-network

    restart: unless-stopped


volumes:
  mysql-data:


networks:
  two-tier-network: